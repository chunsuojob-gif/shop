  if(S.phone) b+='<a class="hbtn" href="tel:'+esc(S.phone.replace(/[^\d+]/g,""))+'">📞 '+esc(S.phone)+'</a>';
  if(S.address) b+='<a class="hbtn" href="'+esc(mapLink())+'" target="_blank" rel="noopener">📍 店在哪</a>';
  $("hbar").innerHTML=b;
  $("foot").innerHTML=esc(S.shop)+(S.address?("<br>"+esc(S.address)):"")+(S.hours?("<br>"+esc(S.hours)):"")+"<br>資料更新 "+esc(S.updated)+"．實際庫存以店內為準";
  var cats=["全部"]; S.items.forEach(function(it){ if(!it.sold&&cats.indexOf(it.cat)<0) cats.push(it.cat); }); var nsold=S.items.filter(function(i){return i.sold}).length; if(nsold) cats.push("已售出");
  $("chips").innerHTML=cats.map(function(c){var n=c==="已售出"?nsold:c==="全部"?S.items.filter(function(i){return !i.sold}).length:S.items.filter(function(i){return !i.sold&&i.cat===c}).length;return '<button class="chip'+(c==="已售出"?' sd':'')+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+' '+n+'</button>'}).join("");
  [].forEach.call(document.querySelectorAll(".chip"),function(b){b.onclick=function(){cat=b.getAttribute("data-c");head();render();}});
}
function render(){
  var q=$("q").value.trim().toLowerCase(), so=$("sort").value;
  var list=S.items.filter(function(it){ return (cat==="已售出"?!!it.sold:(!it.sold&&(cat==="全部"||it.cat===cat))) && (!q || (it.title+" "+it.intro+" "+it.id+" "+it.cat).toLowerCase().indexOf(q)>=0); });
  if(cat==="已售出") list=list.slice().sort(function(a,b){return a.sold<b.sold?1:-1}); else if(so!=="new") list=list.slice().sort(function(a,b){ var x=a.price||1e12, y=b.price||1e12; return so==="low"?x-y:(b.price||0)-(a.price||0); });
  $("count").textContent=cat==="已售出"?("最近賣出 "+list.length+" 台（想找類似的歡迎問我們）"):("共 "+list.length+" 台現貨");
  $("grid").innerHTML=list.length?list.map(function(it){
    var bg=it.photos.length?' style="background-image:url(\''+esc(it.photos[0])+'_t.jpg\')"':"";
    return '<button class="card'+(it.sold?' sold':'')+'" data-id="'+esc(it.id)+'"><div class="ph"'+bg+'>'+(it.photos.length?"":'<div class="np">💻</div>')+'<span class="cat">'+esc(it.cat)+'</span>'+(it.sold?'<span class="stamp">已售出</span>':'')+'</div>'+
      '<div class="ci"><div class="tt">'+esc(it.title)+'</div>'+(S.show_pid?'<div class="pid">編號 '+esc(it.id)+'</div>':'')+
      priceHtml(it)+'</div></button>';
  }).join(""):'<div class="empty">目前沒有符合的機台<br>歡迎直接到店或 LINE 詢問</div>';
  [].forEach.call(document.querySelectorAll(".card"),function(c){c.onclick=function(){location.hash=encodeURIComponent(c.getAttribute("data-id"))}});
}
function openItem(id){
  var it=S.items.filter(function(i){return i.id===id})[0]; if(!it){closeItem();return;}
  var g=it.photos.length?it.photos.map(function(p){return '<img src="'+esc(p)+'.jpg" alt="" loading="lazy">'}).join(""):'<div style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#64748B;width:100%">💻</div>';
  var l=lineLink(it), acts="";
  if(l) acts+='<a class="act line" href="'+esc(l)+'" target="_blank" rel="noopener">'+(it.sold?"💬 LINE 問有沒有類似的":"💬 LINE 問這台")+'</a>';
  if(S.phone) acts+='<a class="act" href="tel:'+esc(S.phone.replace(/[^\d+]/g,""))+'">📞 打電話</a>';
  acts+='<button class="act share" onclick="shareItem()">🔗 分享這台</button>';
  if(S.address) acts+='<a class="act" href="'+esc(mapLink())+'" target="_blank" rel="noopener">📍 店在哪</a>';
  $("panel").innerHTML='<button class="x" onclick="closeItem()" aria-label="關閉">✕</button><div class="gal" id="gal">'+g+'</div>'+
    (it.photos.length>1?'<div class="dots" id="dots">'+it.photos.map(function(_,i){return '<i'+(i?'':' class="on"')+'></i>'}).join("")+'</div>':'')+
    '<div class="pb"><div class="meta"><span>'+esc(it.cat)+'</span>'+(S.show_pid?'<span>編號 '+esc(it.id)+'</span>':'')+'</div><h1>'+esc(it.title)+'</h1>'+
    priceHtml(it)+'<div class="views" id="iv"></div>'+
    (it.intro?'<div class="intro">'+esc(it.intro)+'</div>':'')+'<div class="acts">'+acts+'</div>'+
    (it.sold?'<div class="note">這台已經賣出了（'+esc(it.sold)+'）。想找類似規格的，歡迎 LINE 或來電，我們幫你留意。</div>':'')+'<div class="note">照片為實機拍攝。'+(S.show_pid?'詢問時告訴我們「編號 '+esc(it.id)+'」最快。':'')+'實際庫存以店內為準。</div></div>';
  $("sheet").classList.add("on"); document.body.style.overflow="hidden";
  var gal=$("gal"), dots=$("dots");
  if(dots) gal.onscroll=function(){var i=Math.round(gal.scrollLeft/gal.clientWidth);[].forEach.call(dots.children,function(d,k){d.className=k===i?"on":""})};
  window._cur=it; countItem(it);
}
function closeItem(){ $("sheet").classList.remove("on"); document.body.style.overflow=""; if(location.hash) history.replaceState(null,"",location.pathname+location.search); }
function shareItem(){
  var it=window._cur, u=location.href.split("#")[0]+"#"+encodeURIComponent(it.id), t=S.shop+"｜"+it.title+(it.price?(" "+money(it.price)):"");
  if(navigator.share){ navigator.share({title:t,url:u}).catch(function(){}); }
  else { var ta=document.createElement("textarea"); ta.value=t+"\n"+u; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch(e){} ta.remove(); alert("已複製連結"); }
}
function route(){ var h=decodeURIComponent(location.hash.slice(1)); if(h) openItem(h); else { $("sheet").classList.remove("on"); document.body.style.overflow=""; } }
$("q").oninput=render; $("sort").onchange=render; window.onhashchange=route;
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeItem(); });
head(); render(); route(); countHome();
</script>
</body>
</html>
